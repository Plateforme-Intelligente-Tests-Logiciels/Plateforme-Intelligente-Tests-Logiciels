name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive repository
        run: |
          tar \
            --exclude=./.git \
            --exclude=./node_modules \
            --exclude=./plateforme-tests/node_modules \
            --exclude=./plateforme-back/.venv \
            --exclude=./plateforme-back/__pycache__ \
            --exclude=./.venv \
            -czf /tmp/app.tar.gz .

      - name: Copy archive to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "/tmp/app.tar.gz"
          target: "/home/${{ secrets.VPS_USER }}/deploy"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@master
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASSWORD,SMTP_FROM,SMTP_USE_TLS
          script: |
            set -e

            mkdir -p ~/deploy/app
            touch ~/deploy/backend.env

            # Inject SMTP credentials from GitHub Secrets into backend.env
            sed -i '/^SMTP_/d' ~/deploy/backend.env
            echo "SMTP_HOST=$SMTP_HOST" >> ~/deploy/backend.env
            echo "SMTP_PORT=$SMTP_PORT" >> ~/deploy/backend.env
            echo "SMTP_USER=$SMTP_USER" >> ~/deploy/backend.env
            echo "SMTP_PASSWORD=$SMTP_PASSWORD" >> ~/deploy/backend.env
            echo "SMTP_FROM=$SMTP_FROM" >> ~/deploy/backend.env
            echo "SMTP_USE_TLS=$SMTP_USE_TLS" >> ~/deploy/backend.env

            rm -rf ~/deploy/app/* ~/deploy/app.tar.gz

            ARCHIVE_PATH=$(find ~/deploy -maxdepth 2 -name app.tar.gz | head -n 1)
            if [ -z "$ARCHIVE_PATH" ]; then
              echo "app.tar.gz was not found under ~/deploy"
              exit 1
            fi

            tar -xzf "$ARCHIVE_PATH" -C ~/deploy/app
            cp ~/deploy/backend.env ~/deploy/app/plateforme-back/.env

            cd ~/deploy/app
            export NGINX_PORT=80
            export NEXT_PUBLIC_API_URL=http://51.255.202.68

            if [ -f docker-compose.yml ]; then
              if command -v docker-compose >/dev/null 2>&1; then
                docker-compose down --remove-orphans || true
                docker rm -f frontend backend nginx postgres_db || true
                docker-compose up -d --build --force-recreate
              else
                docker compose down --remove-orphans || true
                docker rm -f frontend backend nginx postgres_db || true
                docker compose up -d --build --force-recreate
              fi

            elif command -v docker >/dev/null 2>&1 && [ -f plateforme-back/Dockerfile ]; then
              docker build -t plateforme-back ./plateforme-back
              docker rm -f plateforme-back || true
              docker run -d --name plateforme-back -p 8000:8000 plateforme-back

            else
              echo "No docker setup found"
            fi